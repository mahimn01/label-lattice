[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labellattice"
version = "0.1.0"
description = "Label-Lattice memoization with Lazy-Meet Factoring: share costly per-document AI work between users without sharing secrets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["numpy"]

[project.scripts]
labellattice = "labellattice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = ["experiments"]
addopts = "-q"
